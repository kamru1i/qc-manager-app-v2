name: "PR Check"

# Every PR into develop or main must pass this before merge. Ubuntu-only and
# no Tauri/Rust, so it stays cheap (~2-3 min).
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json / tauri.conf.json / Cargo.toml agree
        run: npm run version:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .
